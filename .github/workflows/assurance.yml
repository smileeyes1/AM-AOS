name: AM-AOS Assurance Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Validate required documents and schema
        run: |
          test -s schemas/mission.schema.json
          test -s docs/PROJECT_OPERATING_CONTRACT.md
          test -s docs/REFERENCE_DEFINITION_v1.0.md
          test -s docs/REQUIREMENTS_BASELINE_v1.0.md
          test -s docs/ASSURANCE_MATRIX_v1.0.md
      - name: Run assurance test suite
        run: python -m pytest -q
