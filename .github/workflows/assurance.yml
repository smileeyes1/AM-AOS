name: AM-AOS Assurance Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Validate required documents and schema
        run: |
          test -s schemas/mission.schema.json
          test -s docs/PROJECT_OPERATING_CONTRACT.md
          test -s docs/REFERENCE_DEFINITION_v1.0.md
          test -s docs/REQUIREMENTS_BASELINE_v1.0.md
          test -s docs/ASSURANCE_MATRIX_v1.0.md
          test -s docs/MASTER_AUTONOMOUS_EXECUTION_CONTRACT_v1.0.md
          test -s docs/PROJECT_STATE.md
          test -s docs/AUTONOMOUS_CONTROLLER_SPEC_v1.0.md
      - name: Compile source
        env:
          PYTHONPATH: src
        run: python -m compileall -q src
      - name: Run assurance and regression suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Validate fail-closed invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('src/am_aos/task_queue.py'),
              Path('src/am_aos/capabilities.py'),
              Path('src/am_aos/project_controller.py'),
              Path('src/am_aos/gates.py'),
              Path('src/am_aos/delivery.py'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing runtime components: ' + ', '.join(missing))
          print('AM-AOS runtime invariants: PASS')
      - name: Build assurance evidence
        if: always()
        run: |
          mkdir -p evidence
          printf 'commit=%s\nrun=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > evidence/ci-context.txt
          find tests -type f -name 'test_*.py' | sort > evidence/test-inventory.txt
      - name: Publish assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-aos-assurance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
