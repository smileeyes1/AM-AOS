name: assurance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assurance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python-version: ['3.11','3.12','3.13']}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install --upgrade pip pytest
      - name: Validate required baseline documents
        run: |
          test -s schemas/mission.schema.json
          test -s docs/PROJECT_OPERATING_CONTRACT.md
          test -s docs/REFERENCE_DEFINITION_v1.0.md
          test -s docs/REQUIREMENTS_BASELINE_v1.0.md
          test -s docs/ASSURANCE_MATRIX_v1.0.md
          test -s docs/AUTONOMOUS_OPERATION.md
      - name: Run tests and capture evidence
        run: |
          mkdir -p .assurance
          python -m pytest -q --junitxml=.assurance/pytest.xml 2>&1 | tee .assurance/pytest.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Runtime self-check
        run: python -m am_aos --self-check | tee .assurance/self-check.txt
      - name: Verify repository has no accidental secrets
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})' src tests docs schemas .github --exclude-dir=.git
      - name: Publish machine-readable assurance summary
        if: always()
        run: |
          {
            echo '## AM-AOS Assurance Evidence'
            echo ''
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Python: `${{ matrix.python-version }}`"
            echo "- Tests: `$(tail -n 1 .assurance/pytest.txt 2>/dev/null || echo unavailable)`"
            echo "- Self-check: `$(cat .assurance/self-check.txt 2>/dev/null || echo unavailable)`"
            echo '- Secret-pattern scan: completed'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-evidence-py${{ matrix.python-version }}-${{ github.sha }}
          path: .assurance/
          if-no-files-found: warn
          retention-days: 14
