name: AM-AOS Autonomous Assurance Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: am-aos-autonomous-assurance
  cancel-in-progress: false

jobs:
  assurance-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile
        env:
          PYTHONPATH: src
        run: python -m compileall -q src
      - name: Full regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Verify mission-control contracts
        run: |
          test -s docs/AUTONOMOUS_MISSION_CONTROL_v1.0.md
          test -s docs/MASTER_AUTONOMOUS_EXECUTION_CONTRACT_v1.0.md
          test -s src/am_aos/task_queue.py
          test -s src/am_aos/controller.py
          test -s src/am_aos/gates.py
          test -s src/am_aos/delivery.py
          test -s src/am_aos/worker.py
      - name: Worker smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import tempfile
          from am_aos.worker import SandboxWorker
          with tempfile.TemporaryDirectory() as d:
              result = SandboxWorker(d).execute(("python", "-c", "print('am-aos-worker-ok')"))
              assert result.status == "PASS"
              assert result.return_code == 0
          PY
      - name: Produce resumable assurance marker
        run: |
          mkdir -p evidence
          printf 'status=TESTED\ncommit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/autonomous-assurance.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-assurance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
