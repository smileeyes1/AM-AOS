name: AM-AOS Autonomous Assurance

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: am-aos-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        env: {PYTHONPATH: src}
        run: python -m compileall -q src
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Regression
        env: {PYTHONPATH: src}
        run: python -m pytest -q
      - name: Assurance contract checks
        run: |
          test -s src/am_aos/task_queue.py
          test -s src/am_aos/controller.py
          test -s src/am_aos/autonomous_controller.py
          test -s src/am_aos/evidence.py
          test -s src/am_aos/gates.py
          test -s src/am_aos/delivery.py
          test -s src/am_aos/state.py
      - name: Evidence marker
        if: always()
        run: |
          mkdir -p evidence
          printf 'commit=%s\nrun=%s\nstatus=TEST_EXECUTED\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/assurance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assurance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
